name: Validate portfolio

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated files match their sources
        run: python site/build.py --check
      - name: Check pages and local references
        run: python site/check.py
      - name: Check JavaScript syntax
        run: node --check js/portfolio.js
